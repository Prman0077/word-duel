<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Duel Online</title><link rel="stylesheet" href="style.css"></head><body><main><h1>WORD DUEL</h1><div id="lobby" class="card"><input id="name" placeholder="Your name" value="Player"><div class="row"><label>Goal <select id="goal"><option>400</option><option selected>800</option><option>1200</option></select></label><label>Timer <select id="timer"><option value="0">Off</option><option value="30">30 sec</option><option value="60">60 sec</option><option value="120">2 min</option><option value="300">5 min</option></select></label></div><button id="create">Create Game</button><hr><input id="room" placeholder="Room code"><button id="join">Join Game</button></div><section id="game" hidden><div class="top"><b id="roomCode"></b><span id="score"></span><span id="clock"></span></div><p id="status"></p><div id="board"></div><h3>Your tiles</h3><div id="rack"></div><div class="actions"><button id="play">Play Word</button><button id="undo">Undo</button><button id="exchange">Exchange Selected</button><button id="pass">Pass</button></div><p class="hint">Drag tiles onto the board. Drag your unplayed tiles between squares before pressing Play Word.</p></section></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
